[project]
name = "phoenix-torch"
version = "0.1.0"
description = "Phoenix ranking model in TorchRec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "fbgemm-gpu",
    "torchrec",
    "pyarrow",
    "pandas",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
fbgemm-gpu = { index = "pytorch-cu121" }
torchrec = { index = "pytorch-cu121" }
